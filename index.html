<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#10b981" />
  <title>家庭用电智能诊断器</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 顶部标题栏 -->
    <header class="app-bar">
      <div class="app-bar__title" id="appTitle">家庭用电智能诊断器</div>
      <div class="app-bar__sub" id="appSub">家用电器负荷计算</div>
    </header>

    <main class="view-host">
      <!-- 视图：设备选择（首页） -->
      <section class="view view--active" id="view-home">
        <div class="hero">
          <div class="hero__icon">⚡</div>
          <div class="hero__text">
            <h1>用电负荷测算</h1>
            <p>选择家用电器，智能测算月用电量并给出节能诊断</p>
          </div>
        </div>
        <h2 class="section-title">选择设备</h2>
        <div class="device-grid" id="deviceGrid"><!-- JS 渲染 --></div>
      </section>

      <!-- 视图：设备计算页 -->
      <section class="view" id="view-calc">
        <button class="back-btn" id="calcBack">‹ 返回设备</button>
        <div class="device-head">
          <div class="device-head__icon" id="calcIcon">🌀</div>
          <div>
            <h2 id="calcName">电风扇</h2>
            <p id="calcDesc" class="muted"></p>
          </div>
        </div>

        <div class="presets" id="presets"><!-- 预设功率 --></div>

        <form id="calcForm"><!-- JS 渲染分区表单 --></form>

        <!-- 底部结算条 -->
        <div class="result-bar">
          <div class="result-bar__main">
            <div class="result-bar__kwh">
              <span id="rKwh">0.00</span><small>kWh/月</small>
            </div>
            <div class="result-bar__cost">约 <span id="rCost">0.00</span> 元/月</div>
          </div>
          <button class="btn-primary" id="btnDiagnose">智能诊断</button>
        </div>
      </section>

      <!-- 视图：诊断结果 -->
      <section class="view" id="view-result">
        <button class="back-btn" id="resultBack">‹ 返回</button>
        <div class="result-card">
          <div class="ring" id="ring">
            <svg viewBox="0 0 120 120">
              <circle class="ring__bg" cx="60" cy="60" r="52"></circle>
              <circle class="ring__fg" id="ringFg" cx="60" cy="60" r="52"></circle>
            </svg>
            <div class="ring__label">
              <span id="ringKwh">0.0</span>
              <small>kWh/月</small>
            </div>
          </div>
          <div class="result-meta">
            <div><span class="muted">设备</span><b id="resDevice">—</b></div>
            <div><span class="muted">月电费</span><b id="resCost">0.00 元</b></div>
            <div><span class="muted">省电潜力</span><b id="resSaving">0.00 元</b></div>
          </div>
        </div>

        <h2 class="section-title">节能诊断建议</h2>
        <div class="tips" id="tips"><!-- JS 渲染 --></div>
      </section>

      <!-- 视图：我的（总览） -->
      <section class="view" id="view-mine">
        <h2 class="section-title">我的用电总览</h2>
        <div class="summary">
          <div class="summary__item">
            <span class="muted">累计月用电</span>
            <b><span id="sumKwh">0.0</span> kWh</b>
          </div>
          <div class="summary__item">
            <span class="muted">累计月电费</span>
            <b><span id="sumCost">0.00</span> 元</b>
          </div>
        </div>
        <h3 class="section-sub">已测算设备</h3>
        <div class="record-list" id="recordList"><!-- JS 渲染 --></div>
        <button class="btn-ghost" id="btnClear">清空记录</button>
      </section>
    </main>

    <!-- 底部导航 -->
    <nav class="tabbar">
      <button class="tab tab--active" data-view="view-home"><span>📱</span>设备</button>
      <button class="tab" data-view="view-result"><span>🩺</span>诊断</button>
      <button class="tab" data-view="view-mine"><span>👤</span>我的</button>
    </nav>
  </div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
