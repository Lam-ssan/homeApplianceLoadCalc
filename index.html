<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2b7fff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>家庭用电智诊小助手</title>
  <link rel="stylesheet" href="css/style.css" />
  <script>
    if (sessionStorage.getItem('hldc_entered')) document.documentElement.classList.add('entered');
  </script>
</head>
<body>
  <div id="splash" class="splash" role="dialog" aria-label="欢迎页">
    <img class="splash__img" src="img/first_in.png" alt="家庭用电智诊小助手" />
    <div class="splash__bar">
      <button type="button" class="btn-primary splash__cta" id="btnEnter">开始测算</button>
    </div>
  </div>

  <div id="app">
    <header class="app-bar">
      <button type="button" class="app-bar__back" id="appBack" hidden aria-label="返回">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div class="app-bar__text">
        <div class="app-bar__title" id="appTitle">家庭用电智诊小助手</div>
        <div class="app-bar__sub" id="appSub">选择家电，测算月用电</div>
      </div>
      <div class="app-bar__price-wrap">
        <button type="button" class="app-bar__price" id="appPrice" aria-label="设置电价">设置电价</button>
        <span class="app-bar__price-desc" id="appPriceDesc"></span>
      </div>
    </header>

    <main class="view-host">
      <section class="view view--active" id="view-home">
        <div class="home-stats" id="homeStats" hidden></div>
        <div id="deviceCats"></div>
      </section>

      <section class="view" id="view-calc">
        <div class="device-head">
          <div class="device-head__icon" id="calcIcon">🌀</div>
          <div class="device-head__text">
            <h2 id="calcName">电风扇</h2>
            <p id="calcDesc" class="muted"></p>
          </div>
        </div>
        <div class="presets" id="presets"></div>
        <form id="calcForm"></form>
        <div class="result-bar">
          <div class="result-bar__main">
            <div class="result-bar__kwh">
              <span id="rKwh">0.00</span><small>kWh/月</small>
            </div>
            <div class="result-bar__cost">约 <span id="rCost">0.00</span> 元/月</div>
          </div>
          <div class="result-bar__actions">
            <button type="button" class="btn-outline btn-sm" id="btnDiagnose">节能诊断</button>
            <button type="button" class="btn-primary btn-sm" id="btnAdd">添加设备</button>
          </div>
        </div>
      </section>

      <section class="view" id="view-result">
        <div class="result-card">
          <div class="ring" id="ring">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle class="ring__bg" cx="60" cy="60" r="52"></circle>
              <circle class="ring__fg" id="ringFg" cx="60" cy="60" r="52"></circle>
            </svg>
            <div class="ring__label">
              <span id="ringKwh">0.0</span>
              <small>kWh/月</small>
            </div>
          </div>
          <div class="result-meta">
            <div><span class="muted">设备</span><b id="resDevice">—</b></div>
            <div><span class="muted">月电费</span><b id="resCost">0.00 元</b></div>
            <div><span class="muted">省电潜力</span><b id="resSaving">0.00 元</b></div>
          </div>
        </div>
        <h2 class="section-title">节能诊断建议</h2>
        <div class="tips" id="tips"></div>
        <button type="button" class="btn-primary btn-block" id="btnAddFromResult">加入我的设备</button>
      </section>

      <section class="view" id="view-house">
        <div class="summary" id="houseSummary">
          <div class="summary__item">
            <span class="muted">设备台数</span>
            <b><span id="hsCount">0</span> 台</b>
          </div>
          <div class="summary__item">
            <span class="muted">月用电合计</span>
            <b><span id="hsKwh">0.0</span> kWh</b>
            <span class="muted summary__hint">约 ¥<span id="hsCost">0.00</span>/月</span>
          </div>
          <div class="summary__item">
            <span class="muted">省电潜力</span>
            <b>¥<span id="hsSave">0.0</span></b>
            <span class="muted summary__hint">每月可省（估算）</span>
          </div>
        </div>
        <h3 class="section-sub">用电排名</h3>
        <div class="rank-list" id="houseRank"></div>
        <h3 class="section-sub">全屋节能建议</h3>
        <div class="tips" id="houseTips"></div>
      </section>

      <section class="view" id="view-owned">
        <div class="summary" id="ownedSummary">
          <div class="summary__item">
            <span class="muted">设备总台数</span>
            <b><span id="ownCount">0</span> 台</b>
          </div>
          <div class="summary__item">
            <span class="muted">月用电合计</span>
            <b><span id="ownKwh">0.0</span> kWh</b>
            <span class="muted summary__hint">约 ¥<span id="ownCost">0.00</span>/月</span>
          </div>
        </div>
        <h3 class="section-sub" id="ownedSub">按类型查看，点进去可编辑每台</h3>
        <div class="record-list" id="ownedList"></div>
        <button type="button" class="btn-ghost" id="btnClearOwned">继续添加设备</button>
      </section>
    </main>

    <nav class="tabbar" aria-label="主导航">
      <button type="button" class="tab tab--active" data-view="view-home">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg>
        设备
      </button>
      <button type="button" class="tab" data-view="view-owned">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 4l9 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9.5z"/><path d="M9 21v-8h6v8"/></svg>
        我的
        <span class="badge" id="ownBadge" hidden>0</span>
      </button>
      <button type="button" class="tab" data-view="view-house">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14c2.5-4 5-6 8-6s5.5 2 8 6"/><circle cx="12" cy="14" r="2.2"/><path d="M12 4v2"/></svg>
        诊断
      </button>
    </nav>
  </div>

  <div class="modal" id="confirmModal" hidden>
    <div class="modal__mask"></div>
    <div class="modal__box" role="dialog" aria-modal="true">
      <div class="modal__text" id="confirmText">确定删除这台设备？</div>
      <div class="modal__actions">
        <button type="button" class="btn-outline modal__btn" id="confirmCancel">取消</button>
        <button type="button" class="btn-danger modal__btn" id="confirmOk">删除</button>
      </div>
    </div>
  </div>

  <div class="modal" id="priceModal" hidden>
    <div class="modal__mask"></div>
    <div class="modal__box" role="dialog" aria-modal="true" aria-label="设置电价">
      <div class="modal__title">设置电价</div>
      <p class="modal__hint">选择计费方式与你所在的清远地区</p>
      <div class="tariff-tabs">
        <button type="button" class="tariff-tab is-active" data-type="ladder">阶梯电价<br>（非分时）</button>
        <button type="button" class="tariff-tab" data-type="combined">居民合表电价</button>
        <button type="button" class="tariff-tab" data-type="business">工商业电价</button>
      </div>

      <div class="tariff-panel" data-panel="ladder">
        <div class="tariff-season">
          <span class="tariff-season__label">计费周期</span>
          <div class="seg">
            <button type="button" class="seg__btn is-active" data-season="summer">夏季 5-10月</button>
            <button type="button" class="seg__btn" data-season="winter">非夏季 11-4月</button>
          </div>
        </div>
        <div class="region-list" id="regionListLadder"></div>
      </div>

      <div class="tariff-panel" data-panel="combined" hidden>
        <div class="region-list" id="regionListCombined"></div>
      </div>

      <div class="tariff-panel" data-panel="business" hidden>
        <div class="region region--static is-active">
          <span class="region__name">工商业不满1千伏</span>
          <span class="region__price">¥0.664/度</span>
        </div>
      </div>

      <div class="modal__actions">
        <button type="button" class="btn-outline modal__btn" id="priceCancel">取消</button>
        <button type="button" class="btn-primary modal__btn" id="priceSave">保存</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
